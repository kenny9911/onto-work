<!doctype html>
<html lang="en" data-ah-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="A calm workspace for your projects, ideas, and agents." />
    <title>onto-work</title>
    <script>
      try {
        const theme = localStorage.getItem("onto-work-theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.ahTheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#242320" : "#faf9f6";
      } catch { /* The default light theme works when storage is unavailable. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
